<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANO - Sistema de Onboarding Corporativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-4">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <h4 class="fw-bold text-primary">Carregando Sistema JANO...</h4>
        <p class="text-muted">Redirecionando para o ambiente corporativo correspondente...</p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.JanoAuth.isAuthenticated()) {
                const user = window.JanoAuth.getUser();
                if (user && user.primeiro_acesso) {
                    window.location.href = 'alterar-senha.html';
                } else if (user) {
                    window.location.href = window.JanoAuth.getDashboardUrl(user.perfil);
                } else {
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
