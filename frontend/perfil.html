<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANO - Meu Perfil</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar do Figma -->
        <div id="sidebar-container"></div>

        <!-- Conteúdo Principal -->
        <main class="main-content-figma">
            <!-- Header do Figma -->
            <div class="header-page-figma mb-4">
                <div>
                    <h1 class="header-title-figma">Meu Perfil</h1>
                    <p class="header-subtitle-figma">Visualize suas informações corporativas e gerencie suas credenciais de segurança.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Card 1: Informações Cadastrais -->
                <div class="col-12 col-lg-6">
                    <div class="card-figma h-100">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div id="perfil-avatar" style="width: 54px; height: 54px; border-radius: 50%; background: #1e5bdd; color: #ffffff; font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                JN
                            </div>
                            <div>
                                <h5 class="fw-bold text-dark mb-0" id="perfil-nome">Carregando...</h5>
                                <span class="badge-figma blue" id="perfil-badge-cargo">Carregando cargo</span>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">E-mail Corporativo</label>
                                <div class="fw-semibold text-dark text-break" id="perfil-email">-</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">CPF</label>
                                <div class="fw-semibold text-dark" id="perfil-cpf">-</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">Telefone / Ramal</label>
                                <div class="fw-semibold text-dark" id="perfil-telefone">-</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">Perfil de Acesso (RBAC)</label>
                                <div>
                                    <span class="badge-figma green" id="perfil-perfil">-</span>
                                </div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">Equipe de Trabalho</label>
                                <div class="fw-semibold text-dark" id="perfil-equipe">-</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label-figma text-muted">Data de Ingresso</label>
                                <div class="fw-semibold text-dark" id="perfil-data-criacao">-</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Alteração de Senha -->
                <div class="col-12 col-lg-6">
                    <div class="card-figma h-100">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
                            <h5 class="card-figma-title mb-0">Segurança & Troca de Senha</h5>
                        </div>
                        <p class="card-figma-subtitle mb-3">Defina uma nova senha para manter sua conta protegida.</p>

                        <div id="perfil-senha-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                        <form id="form-alterar-senha-perfil" novalidate>
                            <div class="mb-3">
                                <label for="perfil-senha-atual" class="form-label-figma">Senha atual *</label>
                                <input type="password" class="input-figma" id="perfil-senha-atual" required placeholder="Digite sua senha atual">
                            </div>

                            <div class="mb-3">
                                <label for="perfil-nova-senha" class="form-label-figma">Nova senha *</label>
                                <input type="password" class="input-figma" id="perfil-nova-senha" required minlength="6" placeholder="Mínimo 6 caracteres">
                            </div>

                            <div class="mb-4">
                                <label for="perfil-conf-senha" class="form-label-figma">Confirme a nova senha *</label>
                                <input type="password" class="input-figma" id="perfil-conf-senha" required placeholder="Repita a nova senha">
                            </div>

                            <button type="submit" id="btn-salvar-senha-perfil" class="btn-figma-primary">
                                <i class="bi bi-check2-circle"></i>
                                <span id="btn-salvar-senha-texto">Atualizar Senha</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
